<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="iframe-wrapper">
    <iframe src="https://www.canva.com/design/DAHQvNJKZlA/4UKe8eD9SKZ8bQg4F66GZA/view" allowfullscreen></iframe>
  </div>
</body>
</html>
